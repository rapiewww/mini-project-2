<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-timb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#292524" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bg-timb)"/>
  <g transform="translate(110, 80) scale(0.65)">
    <!-- Lug Sole -->
    <path d="M 50,330 L 510,330 L 510,360 L 50,360 Z" fill="#1c1917"/>
    <!-- Nubuck Boot Body -->
    <path d="M 60,330 C 70,250 110,240 180,240 L 260,200 L 290,90 L 420,90 L 420,250 L 490,250 C 510,280 500,330 470,330 Z" fill="#d97706"/>
    <!-- Padded Collar -->
    <rect x="280" y="70" width="150" height="35" rx="10" fill="#1c1917"/>
    <!-- Eyelets -->
    <circle cx="310" cy="140" r="6" fill="#fde68a"/>
    <circle cx="300" cy="170" r="6" fill="#fde68a"/>
    <circle cx="285" cy="200" r="6" fill="#fde68a"/>
  </g>
  <text x="300" y="360" text-anchor="middle" fill="#fcd34d" font-family="sans-serif" font-weight="600" font-size="14" letter-spacing="3">TIMBERLAND 6-INCH BOOT</text>
</svg>
