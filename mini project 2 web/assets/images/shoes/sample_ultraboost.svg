<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-boost" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="boost-sole" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow-boost" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bg-boost)"/>
  <circle cx="300" cy="200" r="140" fill="#10b981" opacity="0.12"/>
  <g transform="translate(100, 110) scale(0.7)" filter="url(#shadow-boost)">
    <!-- Sole Boost -->
    <path d="M 50,300 C 130,305 450,300 500,280 C 515,260 505,240 460,240 C 400,245 350,250 250,250 C 140,250 80,245 50,270 Z" fill="url(#boost-sole)"/>
    <path d="M 40,295 C 100,320 450,315 505,285 C 495,295 450,305 400,305 C 200,305 100,310 40,295 Z" fill="#10b981"/>
    <!-- Knit Upper -->
    <path d="M 70,265 C 110,230 180,220 250,200 C 310,180 350,140 400,140 C 440,140 460,180 460,240 C 390,245 340,250 240,250 C 140,250 90,250 70,265 Z" fill="#1e293b"/>
    <!-- Three Stripes Cage -->
    <path d="M 280,185 L 295,245" stroke="#10b981" stroke-width="12" stroke-linecap="round"/>
    <path d="M 315,175 L 330,245" stroke="#10b981" stroke-width="12" stroke-linecap="round"/>
    <path d="M 350,165 L 365,245" stroke="#10b981" stroke-width="12" stroke-linecap="round"/>
  </g>
  <text x="300" y="360" text-anchor="middle" fill="#6ee7b7" font-family="sans-serif" font-weight="600" font-size="14" letter-spacing="3">ADIDAS ULTRABOOST LIGHT</text>
</svg>
